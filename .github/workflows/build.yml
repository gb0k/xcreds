name: Build OpenSource XCreds

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-14
    steps:
      # 1. 克隆主分支代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 切换至 Xcode 16+ 编译环境
      - name: Select Xcode 16+
        run: |
          echo "[INFO] 正在定位 Xcode 16+..."
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "[INFO] 选定编译器: $LATEST_XCODE"
          sudo xcode-select -switch "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      # 3. 补齐 ProductLicense 虚拟 Framework、缺失头文件与 Swift 桩代码
      - name: Generate ProductLicense Stub & Tools
        run: |
          echo "[INFO] 正在生成 ProductLicense 虚拟框架与桥接依赖..."
          python3 - << 'EOF'
          import os, re

          # 1. 自动生成 ProductLicense.framework 占位
          carthage_pl = 'Carthage/Build/Mac/ProductLicense.framework/Headers'
          os.makedirs(carthage_pl, exist_ok=True)
          pl_header = """#ifndef ProductLicense_h
          #define ProductLicense_h
          #import <Foundation/Foundation.h>
          @interface ProductLicense : NSObject
          + (instancetype)shared;
          @end
          #endif
          """
          with open(os.path.join(carthage_pl, 'ProductLicense.h'), 'w', encoding='utf-8') as f:
              f.write(pl_header)

          # 2. 补齐 Swift 辅助工具类
          tools_dir = 'tcsopensourcetools/TCSOpenSourceTools/tools'
          os.makedirs(tools_dir, exist_ok=True)
          with open('XCreds.xcodeproj/project.pbxproj', 'r', encoding='utf-8') as f:
              pbx = f.read()

          swift_files = set(re.findall(r'/\*\s*([a-zA-Z0-9_\-]+\.swift)\s+in\s+Sources', pbx))
          stubs = {
              "LoggerHelper.swift": "import Foundation\n@objc public class LoggerHelper: NSObject { @objc public static let shared = LoggerHelper(); @objc public static func log(_ msg: String) {} }",
              "UNIXUtilities.swift": "import Foundation\n@objc public class UNIXUtilities: NSObject { @objc public static func run(command: String, arguments: [String] = []) -> String { return \"\" } }",
              "DataExtension.swift": "import Foundation\nextension Data { public var hexString: String { map { String(format: \"%02hhx\", $0) }.joined() } }",
              "UsernamePassword.swift": "import Foundation\n@objc public class UsernamePassword: NSObject { @objc public var username: String?; @objc public var password: String?; @objc public init(username: String? = nil, password: String? = nil) { self.username = username; self.password = password } }",
              "SecretKeeper.swift": "import Foundation\n@objc public class SecretKeeper: NSObject { @objc public static let shared = SecretKeeper(); @objc public func save(password: String, for account: String) -> Bool { return true }; @objc public func getPassword(for account: String) -> String? { return nil }; @objc public func deletePassword(for account: String) -> Bool { return true } }",
              "UserSecretManager.swift": "import Foundation\n@objc public class UserSecretManager: NSObject { @objc public static let shared = UserSecretManager(); @objc public func saveSecret(_ secret: String, for user: String) -> Bool { return true }; @objc public func getSecret(for user: String) -> String? { return nil } }",
              "FDESetupHelper.swift": "import Foundation\n@objc public class FDESetupHelper: NSObject { @objc public static let shared = FDESetupHelper(); @objc public static func isFDEEnabled() -> Bool { return false }; @objc public static func isEnabled() -> Bool { return false }; @objc public static func addAuthUser(username: String, password: String) -> Bool { return true }; @objc public static func checkFileVaultStatus() -> [String: Any] { return [:] } }"
          }
          for s_name in swift_files:
              fpath = os.path.join(tools_dir, s_name)
              if not os.path.exists(fpath):
                  content = stubs.get(s_name, "import Foundation\n")
                  with open(fpath, 'w', encoding='utf-8') as f:
                      f.write(content)

          # 3. 扫描并补齐所有 Bridging Header 中的 Framework / 头文件引用
          headers = {
              'TCSKeychain.h': """#ifndef TCSKeychain_h
          #define TCSKeychain_h
          #import <Foundation/Foundation.h>
          #import <Security/Security.h>
          @interface TCSKeychain : NSObject
          + (instancetype)sharedKeychain;
          + (NSString *)passwordForService:(NSString *)service account:(NSString *)account;
          + (BOOL)setPassword:(NSString *)password forService:(NSString *)service account:(NSString *)account;
          + (BOOL)deletePasswordForService:(NSString *)service account:(NSString *)account;
          @end
          #endif
          """,
              'TCSUnifiedLogger.h': """#ifndef TCSUnifiedLogger_h
          #define TCSUnifiedLogger_h
          #import <Foundation/Foundation.h>
          @interface TCSUnifiedLogger : NSObject
          + (instancetype)shared;
          + (instancetype)sharedLogger;
          + (void)log:(NSString *)format, ...;
          @end
          #endif
          """
          }
          sys_pfx = ('Foundation', 'Security', 'Cocoa', 'LocalAuthentication', 'AppKit', 'CoreServices')
          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'build' in root: continue
              for f in files:
                  if 'Bridging-Header' in f and f.endswith('.h'):
                      with open(os.path.join(root, f), 'r', encoding='utf-8', errors='ignore') as fp:
                          for line in fp:
                              m = re.search(r'#import\s+[<"]([^>"]+)[>"]', line)
                              if m:
                                  path_str = m.group(1)
                                  if any(path_str.startswith(p) for p in sys_pfx): continue
                                  if '/' in path_str:
                                      fw, hn = path_str.split('/', 1)
                                      fw_h_dir = f'Carthage/Build/Mac/{fw}.framework/Headers'
                                      os.makedirs(fw_h_dir, exist_ok=True)
                                      dest = os.path.join(fw_h_dir, hn)
                                      if not os.path.exists(dest):
                                          with open(dest, 'w', encoding='utf-8') as hf:
                                              hf.write(f"#ifndef {hn.replace('.','_')}\n#define {hn.replace('.','_')}\n#import <Foundation/Foundation.h>\n@interface {fw} : NSObject\n@end\n#endif\n")
                                  else:
                                      hn = path_str
                                      content = headers.get(hn, f"#ifndef {hn.replace('.','_')}\n#define {hn.replace('.','_')}\n#import <Foundation/Foundation.h>\n@interface {hn.replace('.h','')} : NSObject\n@end\n#endif\n")
                                      for d in [tools_dir, 'XCreds', 'XCredsLoginPlugIn', 'tap', 'XCreds AutoFill Extension', 'XCreds Login Overlay']:
                                          if os.path.exists(d):
                                              df = os.path.join(d, hn)
                                              if not os.path.exists(df):
                                                  with open(df, 'w', encoding='utf-8') as out_f:
                                                      out_f.write(content)

          print("[SUCCESS] ProductLicense 与所有依赖组件注入完成。")
          EOF

      # 4. 注入 Issue #107 补丁（彻底去时间与许可限制）
      - name: Apply Issue #107 Unlimited License Patch
        run: |
          echo "[INFO] 正在注入永久有效授权补丁 (LicenseChecker -> .valid)..."
          python3 - << 'EOF'
          import os, re
          for root, dirs, files in os.walk('.'):
              if 'LicenseChecker.swift' in files:
                  path = os.path.join(root, 'LicenseChecker.swift')
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  pattern = r"(func\s+currentLicenseState\s*\([^)]*\)[^{]*\{)"
                  if re.search(pattern, code):
                      code = re.sub(pattern, r"\1\n        return .valid", code, count=1)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f"[SUCCESS] 已注入补丁: {path}")
          EOF

      # 5. 执行 Release 构建（使用 Ad-hoc 签名并清空开发者 Team 绑定）
      - name: Build XCreds Release
        run: |
          xcodebuild -project XCreds.xcodeproj \
                     -scheme "XCreds" \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=YES \
                     DEVELOPMENT_TEAM="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     clean build

      # 6. 读取真实版本并打包为 PKG
      - name: Create Distribution PKG
        run: |
          APP_PATH="./build/Build/Products/Release/XCreds.app"
          APP_VERSION=$(defaults read "$(pwd)/$APP_PATH/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "latest")
          echo "打包版本: v${APP_VERSION}"
          
          mkdir -p pkg_root/Applications
          cp -R "$APP_PATH" pkg_root/Applications/
          
          pkgbuild --root pkg_root \
                   --identifier com.twocanoes.xcreds \
                   --version "${APP_VERSION}" \
                   --install-location / \
                   XCreds-Unlimited.pkg

      # 7. 上传生成的 PKG 到 Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCreds-Unlimited-PKG
          path: XCreds-Unlimited.pkg
          retention-days: 7
