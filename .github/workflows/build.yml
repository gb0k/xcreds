name: Build OpenSource XCreds

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: '目标 Git Tag 名称'
        required: true
        default: 'tag-5.9.1(9158)'

jobs:
  build-and-package:
    runs-on: macos-14
    steps:
      # 1. 干净拉取官方指定 Tag 源码
      - name: Checkout Specific Upstream Tag
        uses: actions/checkout@v4
        with:
          repository: twocanoes/xcreds
          ref: ${{ github.event.inputs.target_tag }}
          path: repo

      # 2. 切换至 Xcode 16+ 编译器
      - name: Select Xcode 16+
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          [ -z "$LATEST_XCODE" ] && LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "[INFO] 选定 Xcode: $LATEST_XCODE"
          sudo xcode-select -switch "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      # 3. 构造全套 Mock 头文件、ProductLicense 虚拟 Framework 与 Swift 依赖
      - name: Build Mock Headers, Frameworks & Swift Stubs
        run: |
          cd repo
          echo "[INFO] 正在全量构建 Mock 头文件与 ProductLicense.framework..."
          python3 - << 'EOF'
          import os

          # 1. 创建 ProductLicense.framework 及其 ModuleMap
          pl_dir = 'Carthage/Build/Mac/ProductLicense.framework'
          pl_headers = os.path.join(pl_dir, 'Headers')
          pl_modules = os.path.join(pl_dir, 'Modules')
          os.makedirs(pl_headers, exist_ok=True)
          os.makedirs(pl_modules, exist_ok=True)

          with open(os.path.join(pl_headers, 'ProductLicense.h'), 'w', encoding='utf-8') as f:
              f.write("""#pragma once
          #import <Foundation/Foundation.h>
          @interface ProductLicense : NSObject
          + (instancetype)shared;
          - (BOOL)isValid;
          @end
          """)

          with open(os.path.join(pl_modules, 'module.modulemap'), 'w', encoding='utf-8') as f:
              f.write("""framework module ProductLicense {
              umbrella header "ProductLicense.h"
              export *
              module * { export * }
          }
          """)

          # 2. 核心 Objective-C 桥接头文件定义
          headers_content = {
              "TCSKeychain.h": """#pragma once
          #import <Foundation/Foundation.h>
          #import <Security/Security.h>
          @interface TCSKeychain : NSObject
          + (instancetype)sharedKeychain;
          + (NSString *)passwordForService:(NSString *)service account:(NSString *)account;
          + (BOOL)setPassword:(NSString *)password forService:(NSString *)service account:(NSString *)account;
          + (BOOL)deletePasswordForService:(NSString *)service account:(NSString *)account;
          @end
          """,
              "TCSUnifiedLogger.h": """#pragma once
          #import <Foundation/Foundation.h>
          @interface TCSUnifiedLogger : NSObject
          + (instancetype)shared;
          + (instancetype)sharedLogger;
          + (void)log:(NSString *)format, ...;
          @end
          """,
              "TCTaskHelper.h": """#pragma once
          #import <Foundation/Foundation.h>
          @interface TCTaskHelper : NSObject
          + (NSString *)runTaskWithCommand:(NSString *)command arguments:(NSArray *)arguments;
          @end
          """,
              "TCTaskWrapperWithBlocks.h": """#pragma once
          #import <Foundation/Foundation.h>
          @interface TCTaskWrapperWithBlocks : NSObject
          - (void)startProcess;
          - (void)stopProcess;
          @end
          """
          }

          # 将头文件分发至所有可能被引用的目录
          target_dirs = [
              'XCreds',
              'XCreds AutoFill Extension',
              'XCreds Login Overlay',
              'XCredsLoginPlugIn',
              'tap',
              'tcsopensourcetools/TCSOpenSourceTools/tools',
              'tcsopensourcetools/TCSOpenSourceTools',
              'tcsopensourcetools'
          ]
          for d in target_dirs:
              os.makedirs(d, exist_ok=True)
              for h_name, code in headers_content.items():
                  with open(os.path.join(d, h_name), 'w', encoding='utf-8') as f:
                      f.write(code)

          # 3. 补齐 Swift 工具类桩代码
          tools_dir = 'tcsopensourcetools/TCSOpenSourceTools/tools'
          swift_stubs = {
              "LoggerHelper.swift": """import Foundation
          @objc(LoggerHelper)
          public class LoggerHelper: NSObject {
              @objc public static let shared = LoggerHelper()
              @objc public static func log(_ msg: String) {}
          }
          """,
              "UNIXUtilities.swift": """import Foundation
          @objc(UNIXUtilities)
          public class UNIXUtilities: NSObject {
              @objc public static func run(command: String, arguments: [String] = []) -> String { return "" }
          }
          """,
              "DataExtension.swift": """import Foundation
          extension Data {
              public var hexString: String { map { String(format: "%02hhx", $0) }.joined() }
          }
          """,
              "UsernamePassword.swift": """import Foundation
          @objc(UsernamePassword)
          public class UsernamePassword: NSObject {
              @objc public var username: String?
              @objc public var password: String?
              @objc public init(username: String? = nil, password: String? = nil) {
                  self.username = username
                  self.password = password
              }
          }
          """,
              "SecretKeeper.swift": """import Foundation
          @objc(SecretKeeper)
          public class SecretKeeper: NSObject {
              @objc public static let shared = SecretKeeper()
              @objc public func save(password: String, for account: String) -> Bool { return true }
              @objc public func getPassword(for account: String) -> String? { return nil }
              @objc public func deletePassword(for account: String) -> Bool { return true }
          }
          """,
              "UserSecretManager.swift": """import Foundation
          @objc(UserSecretManager)
          public class UserSecretManager: NSObject {
              @objc public static let shared = UserSecretManager()
              @objc public func saveSecret(_ secret: String, for user: String) -> Bool { return true }
              @objc public func getSecret(for user: String) -> String? { return nil }
          }
          """,
              "FDESetupHelper.swift": """import Foundation
          @objc(FDESetupHelper)
          public class FDESetupHelper: NSObject {
              @objc public static let shared = FDESetupHelper()
              @objc public static func isFDEEnabled() -> Bool { return false }
              @objc public static func isEnabled() -> Bool { return false }
              @objc public static func addAuthUser(username: String, password: String) -> Bool { return true }
              @objc public static func checkFileVaultStatus() -> [String: Any] { return [:] }
          }
          """
          }
          for s_name, code in swift_stubs.items():
              with open(os.path.join(tools_dir, s_name), 'w', encoding='utf-8') as f:
                  f.write(code)

          print("[SUCCESS] Mock 头文件、Framework 及 Swift 依赖生成完毕。")
          EOF

      # 4. 注入 Issue #107 补丁 (解除时间与授权限制)
      - name: Apply Issue #107 Unlimited License Patch
        run: |
          cd repo
          echo "[INFO] 正在注入永久有效授权补丁 (LicenseChecker -> .valid)..."
          python3 - << 'EOF'
          import os, re
          for root, dirs, files in os.walk('.'):
              if 'LicenseChecker.swift' in files:
                  path = os.path.join(root, 'LicenseChecker.swift')
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  pattern = r"(func\s+currentLicenseState\s*\([^)]*\)[^{]*\{)"
                  if re.search(pattern, code):
                      code = re.sub(pattern, r"\1\n        return .valid", code, count=1)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f"[SUCCESS] 补丁注入成功: {path}")
          EOF

      # 5. 执行免证书构建并全局指定 Framework & Header 搜索路径
      - name: Build XCreds Release
        run: |
          cd repo
          echo "[INFO] 正在编译 Release 版本..."
          xcodebuild -project XCreds.xcodeproj \
                     -scheme "XCreds" \
                     -configuration Release \
                     -derivedDataPath ./build_output \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=YES \
                     FRAMEWORK_SEARCH_PATHS='$(inherited) $(SRCROOT)/Carthage/Build/Mac' \
                     HEADER_SEARCH_PATHS='$(inherited) $(SRCROOT)/XCreds $(SRCROOT)/tcsopensourcetools/TCSOpenSourceTools/tools' \
                     clean build

      # 6. 打包为 PKG 安装包
      - name: Package Distribution PKG
        run: |
          cd repo
          echo "[INFO] 正在生成安装包..."
          APP_PATH="./build_output/Build/Products/Release/XCreds.app"
          APP_VERSION=$(defaults read "$(pwd)/$APP_PATH/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "5.9.1")
          
          mkdir -p pkg_root/Applications
          cp -R "$APP_PATH" pkg_root/Applications/

          pkgbuild --root pkg_root \
                   --identifier com.twocanoes.xcreds \
                   --version "${APP_VERSION}" \
                   --install-location / \
                   ../XCreds-5.9.1-Unlimited.pkg

      # 7. 上传生成的 PKG 到 Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCreds-5.9.1-Unlimited-PKG
          path: XCreds-5.9.1-Unlimited.pkg
          retention-days: 7
