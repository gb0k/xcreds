name: Build OpenSource XCreds

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false # 关闭默认拉取，由下方脚本通过 HTTPS 处理

      - name: Fix Submodules to HTTPS and Sync
        run: |
          echo "[INFO] 正在将子模块 SSH 协议重定向为 HTTPS..."
          # 全局将 SSH 访问强制重定向为公开的 HTTPS 协议
          git config --global url."https://bitbucket.org/".insteadOf "git@bitbucket.org:"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          
          # 同步并拉取所有子模块
          git submodule sync
          git submodule update --init --recursive

      - name: Apply Unlimited License Patch
        run: |
          python3 - <<EOF
          import os, re
          for root, dirs, files in os.walk('.'):
              if 'LicenseChecker.swift' in files:
                  path = os.path.join(root, 'LicenseChecker.swift')
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  pattern = r"(func\s+currentLicenseState\s*\([^)]*\)[^{]*\{)"
                  if re.search(pattern, code):
                      code = re.sub(pattern, r"\1\n        return .valid", code, count=1)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f"Patched successfully: {path}")
          EOF

      - name: Build XCreds Release
        run: |
          xcodebuild -project XCreds.xcodeproj \
                     -scheme "XCreds" \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Create Distribution PKG
        run: |
          APP_PATH="./build/Build/Products/Release/XCreds.app"
          APP_VERSION=$(defaults read "$(pwd)/$APP_PATH/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "5.x")
          echo "Building PKG for version: $APP_VERSION"
          mkdir -p pkg_root/Applications
          cp -R "$APP_PATH" pkg_root/Applications/
          pkgbuild --root pkg_root \
                   --identifier com.twocanoes.xcreds \
                   --version "${APP_VERSION}" \
                   --install-location / \
                   XCreds-Unlimited.pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCreds-Unlimited-PKG
          path: XCreds-Unlimited.pkg
          retention-days: 7
