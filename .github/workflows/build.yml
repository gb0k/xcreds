name: Build OpenSource XCreds

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-14
    steps:
      # 1. 克隆主仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 切换至 Xcode 16+
      - name: Select Xcode 16+
        run: |
          echo "[INFO] 正在切换至 Xcode 16 环境..."
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "[INFO] 选定 Xcode: $LATEST_XCODE"
          sudo xcode-select -switch "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      # 3. 补全缺失的 tcsopensourcetools 源码占位
      - name: Create Missing Tool Files
        run: |
          echo "[INFO] 正在补全缺失的辅助工具文件..."
          mkdir -p tcsopensourcetools/TCSOpenSourceTools/tools

          # 1. 补齐 LoggerHelper.swift
          cat << 'EOF' > tcsopensourcetools/TCSOpenSourceTools/tools/LoggerHelper.swift
          import Foundation
          import os.log

          public func TCSLog(_ message: String, _ args: CVarArg...) {
              NSLog(message, args)
          }

          public class LoggerHelper {
              public static let shared = LoggerHelper()
              public init() {}
              public static func log(_ msg: String) {
                  NSLog("%@", msg)
              }
          }
          EOF

          # 2. 补齐 UNIXUtilities.swift
          cat << 'EOF' > tcsopensourcetools/TCSOpenSourceTools/tools/UNIXUtilities.swift
          import Foundation

          public class UNIXUtilities {
              public static func run(command: String, arguments: [String] = []) -> String {
                  let process = Process()
                  process.executableURL = URL(fileURLWithPath: command)
                  process.arguments = arguments
                  let pipe = Pipe()
                  process.standardOutput = pipe
                  process.standardError = pipe
                  try? process.run()
                  process.waitUntilExit()
                  let data = pipe.fileHandleForReading.readDataToEndOfFile()
                  return String(data: data, encoding: .utf8) ?? ""
              }
          }
          EOF

          # 3. 补齐 DataExtension.swift
          cat << 'EOF' > tcsopensourcetools/TCSOpenSourceTools/tools/DataExtension.swift
          import Foundation

          extension Data {
              public var hexString: String {
                  return map { String(format: "%02hhx", $0) }.joined()
              }
          }
          EOF
          echo "[SUCCESS] 缺失文件补全完成。"

      # 4. 注入永久有效授权补丁 (解除 14 天限制)
      - name: Apply Unlimited License Patch
        run: |
          python3 - <<EOF
          import os, re
          for root, dirs, files in os.walk('.'):
              if 'LicenseChecker.swift' in files:
                  path = os.path.join(root, 'LicenseChecker.swift')
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  pattern = r"(func\s+currentLicenseState\s*\([^)]*\)[^{]*\{)"
                  if re.search(pattern, code):
                      code = re.sub(pattern, r"\1\n        return .valid", code, count=1)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f"Patched successfully: {path}")
          EOF

      # 5. 执行免证书 Release 构建
      - name: Build XCreds Release
        run: |
          xcodebuild -project XCreds.xcodeproj \
                     -scheme "XCreds" \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      # 6. 打包为 PKG 安装包
      - name: Create Distribution PKG
        run: |
          APP_PATH="./build/Build/Products/Release/XCreds.app"
          APP_VERSION=$(defaults read "$(pwd)/$APP_PATH/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "5.x")
          echo "Building PKG for version: $APP_VERSION"
          mkdir -p pkg_root/Applications
          cp -R "$APP_PATH" pkg_root/Applications/
          pkgbuild --root pkg_root \
                   --identifier com.twocanoes.xcreds \
                   --version "${APP_VERSION}" \
                   --install-location / \
                   XCreds-Unlimited.pkg

      # 7. 上传 Artifacts 供下载
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCreds-Unlimited-PKG
          path: XCreds-Unlimited.pkg
          retention-days: 7
