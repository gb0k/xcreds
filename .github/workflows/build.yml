name: Build OpenSource XCreds

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: '目标 Git Tag 名称'
        required: true
        default: 'tag-5.9.1(9158)'

jobs:
  build-and-package:
    runs-on: macos-14
    steps:
      # 1. 干净拉取官方指定 Tag 源码
      - name: Checkout Specific Upstream Tag
        uses: actions/checkout@v4
        with:
          repository: twocanoes/xcreds
          ref: ${{ github.event.inputs.target_tag }}
          path: repo

      # 2. 切换至 Xcode 16+ 编译器
      - name: Select Xcode 16+
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          [ -z "$LATEST_XCODE" ] && LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "[INFO] 选定 Xcode: $LATEST_XCODE"
          sudo xcode-select -switch "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      # 3. 构造标准 ProductLicense.framework 二进制、Mock 头文件与强化 Swift 桩代码
      - name: Build Standard Mock Framework & Swift Stubs
        run: |
          cd repo
          echo "[INFO] 正在构建标准 ProductLicense.framework 与依赖桩代码..."
          
          # 1. 创建合法的 macOS Framework 目录结构并编译 Mach-O 二进制
          FRAMEWORK_DIR="Carthage/Build/Mac/ProductLicense.framework"
          mkdir -p "$FRAMEWORK_DIR/Versions/A/Headers"
          mkdir -p "$FRAMEWORK_DIR/Versions/A/Modules"
          mkdir -p "$FRAMEWORK_DIR/Versions/A/Resources"

          cat << 'EOF' > dummy.c
          #include <objc/runtime.h>
          void dummy_product_license(void) {}
          EOF
          clang -dynamiclib dummy.c -o "$FRAMEWORK_DIR/Versions/A/ProductLicense" -install_name @rpath/ProductLicense.framework/Versions/A/ProductLicense
          rm -f dummy.c

          cat << 'EOF' > "$FRAMEWORK_DIR/Versions/A/Headers/ProductLicense.h"
          #pragma once
          #import <Foundation/Foundation.h>
          @interface ProductLicense : NSObject
          + (instancetype)shared;
          - (BOOL)isValid;
          @end
          EOF

          cat << 'EOF' > "$FRAMEWORK_DIR/Versions/A/Modules/module.modulemap"
          framework module ProductLicense {
              umbrella header "ProductLicense.h"
              export *
              module * { export * }
          }
          EOF

          cat << 'EOF' > "$FRAMEWORK_DIR/Versions/A/Resources/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.twocanoes.ProductLicense</string>
              <key>CFBundleExecutable</key>
              <string>ProductLicense</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
          </dict>
          </plist>
          EOF

          # 构建 Framework 标准软链接
          cd "$FRAMEWORK_DIR"
          ln -sf Versions/A/Headers Headers
          ln -sf Versions/A/Modules Modules
          ln -sf Versions/A/Resources Resources
          ln -sf Versions/A/ProductLicense ProductLicense
          ln -sf A Versions/Current
          cd ../../../../

          # 2. 补齐 Objective-C 头文件与全能 Swift 依赖桩代码
          python3 - << 'EOF'
          import os

          headers_content = {
              "TCSKeychain.h": """#pragma once
          #import <Foundation/Foundation.h>
          #import <Security/Security.h>
          @interface TCSKeychain : NSObject
          + (instancetype)sharedKeychain;
          + (instancetype)shared;
          + (NSString *)passwordForService:(NSString *)service account:(NSString *)account;
          + (BOOL)setPassword:(NSString *)password forService:(NSString *)service account:(NSString *)account;
          + (BOOL)deletePasswordForService:(NSString *)service account:(NSString *)account;
          + (id)findItemForService:(NSString *)service account:(NSString *)account;
          + (BOOL)addItem:(id)item forService:(NSString *)service account:(NSString *)account;
          + (BOOL)deleteItemForService:(NSString *)service account:(NSString *)account;
          - (NSString *)passwordForService:(NSString *)service account:(NSString *)account;
          - (BOOL)setPassword:(NSString *)password forService:(NSString *)service account:(NSString *)account;
          - (BOOL)deletePasswordForService:(NSString *)service account:(NSString *)account;
          @end
          """,
              "TCSUnifiedLogger.h": """#pragma once
          #import <Foundation/Foundation.h>
          @interface TCSUnifiedLogger : NSObject
          + (instancetype)shared;
          + (instancetype)sharedLogger;
          + (void)log:(NSString *)format, ...;
          - (void)log:(NSString *)format, ...;
          @end
          """,
              "TCTaskHelper.h": """#pragma once
          #import <Foundation/Foundation.h>
          @interface TCTaskHelper : NSObject
          + (NSString *)runTaskWithCommand:(NSString *)command arguments:(NSArray *)arguments;
          + (NSString *)runTask:(NSString *)command arguments:(NSArray *)arguments;
          @end
          """,
              "TCTaskWrapperWithBlocks.h": """#pragma once
          #import <Foundation/Foundation.h>
          @interface TCTaskWrapperWithBlocks : NSObject
          @property (copy) void (^outputBlock)(NSString *output);
          @property (copy) void (^errorBlock)(NSString *error);
          @property (copy) void (^completionBlock)(int exitCode);
          - (void)startProcess;
          - (void)stopProcess;
          @end
          """
          }

          target_dirs = [
              'XCreds',
              'XCreds AutoFill Extension',
              'XCreds Login Overlay',
              'XCredsLoginPlugIn',
              'tap',
              'tcsopensourcetools/TCSOpenSourceTools/tools',
              'tcsopensourcetools/TCSOpenSourceTools',
              'tcsopensourcetools'
          ]
          for d in target_dirs:
              os.makedirs(d, exist_ok=True)
              for h_name, code in headers_content.items():
                  with open(os.path.join(d, h_name), 'w', encoding='utf-8') as f:
                      f.write(code)

          tools_dir = 'tcsopensourcetools/TCSOpenSourceTools/tools'
          swift_stubs = {
              "LoggerHelper.swift": """import Foundation
          import os.log
          @objc(LoggerHelper)
          @objcMembers
          public class LoggerHelper: NSObject {
              public static let shared = LoggerHelper()
              public static func log(_ msg: String) {}
              public func log(_ msg: String) {}
              public static var oslog: os.log.OSLog {
                  return os.log.OSLog(subsystem: "com.twocanoes.xcreds", category: "main")
              }
          }
          """,
              "UNIXUtilities.swift": """import Foundation
          @objc(UNIXUtilities)
          @objcMembers
          public class UNIXUtilities: NSObject {
              public static func run(command: String, arguments: [String] = []) -> String { return "" }
              public static func runCommand(_ command: String, args: [String] = []) -> String { return "" }
          }
          """,
              "DataExtension.swift": """import Foundation
          extension Data {
              public var hexString: String { map { String(format: "%02hhx", $0) }.joined() }
              public var string: String? { String(data: self, encoding: .utf8) }
          }
          """,
              "UsernamePassword.swift": """import Foundation
          @objc(UsernamePassword)
          @objcMembers
          public class UsernamePassword: NSObject {
              public var username: String?
              public var password: String?
              public var domain: String?
              public override init() { super.init() }
              public init(username: String?, password: String?) {
                  self.username = username
                  self.password = password
                  super.init()
              }
              public init(username: String?, password: String?, domain: String?) {
                  self.username = username
                  self.password = password
                  self.domain = domain
                  super.init()
              }
          }
          """,
              "SecretKeeper.swift": """import Foundation
          @objc(SecretKeeper)
          @objcMembers
          public class SecretKeeper: NSObject {
              public static let shared = SecretKeeper()
              public func save(password: String, for account: String) -> Bool { return true }
              public func getPassword(for account: String) -> String? { return nil }
              public func deletePassword(for account: String) -> Bool { return true }
              public static func save(password: String, for account: String) -> Bool { return true }
              public static func getPassword(for account: String) -> String? { return nil }
              public static func deletePassword(for account: String) -> Bool { return true }
          }
          """,
              "UserSecretManager.swift": """import Foundation
          @objc(UserSecretManager)
          @objcMembers
          public class UserSecretManager: NSObject {
              public static let shared = UserSecretManager()
              public func saveSecret(_ secret: String, for user: String) -> Bool { return true }
              public func getSecret(for user: String) -> String? { return nil }
              public static func saveSecret(_ secret: String, for user: String) -> Bool { return true }
              public static func getSecret(for user: String) -> String? { return nil }
          }
          """,
              "FDESetupHelper.swift": """import Foundation
          @objc(FDESetupHelper)
          @objcMembers
          public class FDESetupHelper: NSObject {
              public static let shared = FDESetupHelper()
              public static func isFDEEnabled() -> Bool { return false }
              public static func isEnabled() -> Bool { return false }
              public static func addAuthUser(username: String, password: String) -> Bool { return true }
              public static func checkFileVaultStatus() -> [String: Any] { return [:] }
              public func isFDEEnabled() -> Bool { return false }
              public func isEnabled() -> Bool { return false }
          }
          """
          }
          for s_name, code in swift_stubs.items():
              with open(os.path.join(tools_dir, s_name), 'w', encoding='utf-8') as f:
                  f.write(code)

          print("[SUCCESS] 依赖补齐就绪。")
          EOF

      # 4. 注入 Issue #107 补丁 (解除时间与授权限制)
      - name: Apply Issue #107 Unlimited License Patch
        run: |
          cd repo
          echo "[INFO] 正在注入永久有效授权补丁 (LicenseChecker -> .valid)..."
          python3 - << 'EOF'
          import os, re
          for root, dirs, files in os.walk('.'):
              if 'LicenseChecker.swift' in files:
                  path = os.path.join(root, 'LicenseChecker.swift')
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  pattern = r"(func\s+currentLicenseState\s*\([^)]*\)[^{]*\{)"
                  if re.search(pattern, code):
                      code = re.sub(pattern, r"\1\n        return .valid", code, count=1)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f"[SUCCESS] 补丁注入成功: {path}")
          EOF

      # 5. 执行 Release 编译
      - name: Build XCreds Release
        run: |
          cd repo
          echo "[INFO] 正在执行 Release 编译..."
          xcodebuild -project XCreds.xcodeproj \
                     -scheme "XCreds" \
                     -configuration Release \
                     -derivedDataPath ./build_output \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=YES \
                     FRAMEWORK_SEARCH_PATHS='$(inherited) $(SRCROOT)/Carthage/Build/Mac' \
                     HEADER_SEARCH_PATHS='$(inherited) $(SRCROOT)/XCreds $(SRCROOT)/tcsopensourcetools/TCSOpenSourceTools/tools' \
                     clean build

      # 6. 生成 PKG 安装包
      - name: Package Distribution PKG
        run: |
          cd repo
          echo "[INFO] 正在生成安装包..."
          APP_PATH="./build_output/Build/Products/Release/XCreds.app"
          APP_VERSION=$(defaults read "$(pwd)/$APP_PATH/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "5.9.1")
          
          mkdir -p pkg_root/Applications
          cp -R "$APP_PATH" pkg_root/Applications/

          pkgbuild --root pkg_root \
                   --identifier com.twocanoes.xcreds \
                   --version "${APP_VERSION}" \
                   --install-location / \
                   ../XCreds-5.9.1-Unlimited.pkg

      # 7. 上传安装包供下载
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCreds-5.9.1-Unlimited-PKG
          path: XCreds-5.9.1-Unlimited.pkg
          retention-days: 7
