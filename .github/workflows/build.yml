name: Build OpenSource XCreds

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false # 关闭默认拉取

      - name: Fix Submodules to GitHub HTTPS
        run: |
          echo "[INFO] 正在修复子模块指向 GitHub 公开仓库..."
          python3 - <<EOF
          import os, re
          if os.path.exists('.gitmodules'):
              with open('.gitmodules', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # 将所有 Bitbucket 地址替换为 GitHub 对应仓库
              content = re.sub(r'git@bitbucket\.org:twocanoes/', 'https://github.com/twocanoes/', content)
              content = re.sub(r'https://bitbucket\.org/twocanoes/', 'https://github.com/twocanoes/', content)
              
              # 将所有 SSH 地址转为 HTTPS
              content = re.sub(r'git@github\.com:', 'https://github.com/', content)
              
              with open('.gitmodules', 'w', encoding='utf-8') as f:
                  f.write(content)
              print(".gitmodules 修复完成")
          EOF

          # 同步新配置并拉取子模块
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Apply Unlimited License Patch
        run: |
          python3 - <<EOF
          import os, re
          for root, dirs, files in os.walk('.'):
              if 'LicenseChecker.swift' in files:
                  path = os.path.join(root, 'LicenseChecker.swift')
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  pattern = r"(func\s+currentLicenseState\s*\([^)]*\)[^{]*\{)"
                  if re.search(pattern, code):
                      code = re.sub(pattern, r"\1\n        return .valid", code, count=1)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f"Patched successfully: {path}")
          EOF

      - name: Build XCreds Release
        run: |
          xcodebuild -project XCreds.xcodeproj \
                     -scheme "XCreds" \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Create Distribution PKG
        run: |
          APP_PATH="./build/Build/Products/Release/XCreds.app"
          APP_VERSION=$(defaults read "$(pwd)/$APP_PATH/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "latest")
          echo "Building PKG for version: $APP_VERSION"
          mkdir -p pkg_root/Applications
          cp -R "$APP_PATH" pkg_root/Applications/
          pkgbuild --root pkg_root \
                   --identifier com.twocanoes.xcreds \
                   --version "${APP_VERSION}" \
                   --install-location / \
                   XCreds-Unlimited.pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCreds-Unlimited-PKG
          path: XCreds-Unlimited.pkg
          retention-days: 7
